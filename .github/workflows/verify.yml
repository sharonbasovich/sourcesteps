name: SourceSteps verification
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --test qa/dialog.test.mjs
      - run: npm ci --prefix qa --ignore-scripts
      - run: npx --prefix qa playwright install --with-deps chromium
      - run: node qa/browser.mjs
      - run: python scripts/release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            qa/evidence
            dist/verification-*/SourceSteps-0.1.3-rc1.zip
            dist/verification-*/SourceSteps-0.1.3-rc1.zip.sha256
            dist/verification-*/verification.json
            dist/verification-*/packaged-tests.tap
          if-no-files-found: error
